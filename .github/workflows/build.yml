name: Build OBS VLC Plugin

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MinGW environment
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download OBS Studio binaries for linking
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/releases/download/33.0.3/OBS-Studio-33.0.3-Windows-x64.zip" -OutFile "obs.zip"
          Expand-Archive obs.zip -DestinationPath "obs-studio"

      - name: Configure CMake
        shell: pwsh
        run: |
          $obsDll = Get-ChildItem -Path "obs-studio" -Recurse -Filter "obs.dll" | Select-Object -First 1
          if (-not $obsDll) {
            Write-Error "Could not find obs.dll in extracted OBS archive"
            exit 1
          }
          $obsDir = $obsDll.Directory.FullName
          Write-Host "Found obs.dll in directory: $obsDir"
          cmake -B build -G "MinGW Makefiles" -DCMAKE_C_COMPILER="gcc.exe" -DCMAKE_MAKE_PROGRAM="mingw32-make.exe" -DOBS_DIR="$obsDir"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Verify DLL dependencies
        shell: pwsh
        run: |
          python -c "
          import struct
          with open('build/vlc-video.dll', 'rb') as f:
              data = f.read()
          e_lfanew = struct.unpack('<I', data[0x3c:0x40])[0]
          opt_header_size = struct.unpack('<H', data[e_lfanew+20:e_lfanew+22])[0]
          num_sections = struct.unpack('<H', data[e_lfanew+6:e_lfanew+8])[0]
          section_offset = e_lfanew + 24 + opt_header_size
          import_rva, import_size = struct.unpack('<II', data[e_lfanew+144:e_lfanew+152])
          sections = []
          for i in range(num_sections):
              sec = data[section_offset + i*40 : section_offset + (i+1)*40]
              vsize, va, rsize, roffset = struct.unpack('<IIII', sec[8:24])
              sections.append((va, vsize, roffset, rsize))
          def rva_to_offset(rva):
              for va, vsize, roffset, rsize in sections:
                  if va <= rva < va + vsize:
                      return roffset + (rva - va)
              return None
          import_offset = rva_to_offset(import_rva)
          pos = import_offset
          imported_dlls = []
          while True:
              ilt, time_stamp, forwarder, name_rva, iat = struct.unpack('<IIIII', data[pos:pos+20])
              if ilt == 0 and name_rva == 0:
                  break
              dll_name_offset = rva_to_offset(name_rva)
              dll_name = data[dll_name_offset:data.find(b'\x00', dll_name_offset)].decode('latin1')
              imported_dlls.append(dll_name)
              pos += 20
          print('Direct DLL dependencies detected:', imported_dlls)
          bad = [d for d in imported_dlls if 'pthread' in d.lower() or 'libgcc' in d.lower()]
          if bad:
              raise SystemExit(f'ERROR: Found unwanted dynamic dependencies: {bad}')
          print('DLL verification PASSED: No unwanted MinGW runtime dependencies!')
          "

      - name: Package Zip Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "package/obs-plugins/64bit"
          New-Item -ItemType Directory -Force -Path "package/data/obs-plugins/vlc-video"
          Copy-Item "build/vlc-video.dll" "package/obs-plugins/64bit/"
          Copy-Item -Recurse "data/locale" "package/data/obs-plugins/vlc-video/"
          Compress-Archive -Path "package/*" -DestinationPath "obs-vlc-by-kubo-windows-x64.zip"

      - name: Build Windows Installer (.exe)
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            Write-Host "Installing NSIS via winget..."
            try {
              winget install NSIS.NSIS --silent --accept-package-agreements --accept-source-agreements
            } catch {
              Write-Warning "winget failed, attempting choco..."
            }
            if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
              choco install nsis -y --no-progress
            }
          }
          $nsisExe = if (Get-Command makensis -ErrorAction SilentlyContinue) { "makensis" } else { "C:\Program Files (x86)\NSIS\makensis.exe" }
          Write-Host "Using NSIS compiler: $nsisExe"
          cd installer/windows
          & $nsisExe installer.nsi
          cd ../..
          if (Test-Path "obs-vlc-by-kubo-windows-x64-installer.exe") {
            Write-Host "Successfully generated Windows installer EXE"
          } else {
            Write-Error "Failed to generate installer EXE"
            exit 1
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obs-vlc-by-kubo-windows-x64
          path: |
            obs-vlc-by-kubo-windows-x64.zip
            obs-vlc-by-kubo-windows-x64-installer.exe

  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libobs-dev libvlc-dev

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Package Tar.gz Artifact
        run: |
          mkdir -p package/obs-plugins/64bit package/data/obs-plugins/vlc-video
          cp build/vlc-video.so package/obs-plugins/64bit/
          cp -r data/locale package/data/obs-plugins/vlc-video/
          tar -czvf obs-vlc-by-kubo-linux-x86_64.tar.gz -C package .

      - name: Build Linux Deb Package (.deb)
        run: |
          mkdir -p deb-pkg/DEBIAN
          mkdir -p deb-pkg/usr/lib/x86_64-linux-gnu/obs-plugins
          mkdir -p deb-pkg/usr/share/obs/obs-plugins/vlc-video/locale

          cp build/vlc-video.so deb-pkg/usr/lib/x86_64-linux-gnu/obs-plugins/
          cp -r data/locale/* deb-pkg/usr/share/obs/obs-plugins/vlc-video/locale/
          cp installer/linux/control deb-pkg/DEBIAN/control
          cp installer/linux/preinst deb-pkg/DEBIAN/preinst
          chmod 755 deb-pkg/DEBIAN/preinst

          dpkg-deb --build --root-owner-group deb-pkg obs-vlc-by-kubo-linux-x86_64.deb

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obs-vlc-by-kubo-linux-x86_64
          path: |
            obs-vlc-by-kubo-linux-x86_64.tar.gz
            obs-vlc-by-kubo-linux-x86_64.deb

  build-macos:
    name: Build (macOS Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install simde

      - name: Configure CMake (Universal Binary)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Package Tar.gz Artifact
        run: |
          mkdir -p package/obs-plugins package/data/obs-plugins/vlc-video
          cp build/vlc-video.so package/obs-plugins/
          cp -r data/locale package/data/obs-plugins/vlc-video/
          tar -czvf obs-vlc-by-kubo-macos-universal.tar.gz -C package .

      - name: Build macOS Installer Package (.pkg)
        run: |
          mkdir -p "pkg-root/Library/Application Support/obs-studio/plugins/vlc-video/bin"
          mkdir -p "pkg-root/Library/Application Support/obs-studio/plugins/vlc-video/data/locale"
          mkdir -p pkg-scripts pkg-resources

          cp build/vlc-video.so "pkg-root/Library/Application Support/obs-studio/plugins/vlc-video/bin/"
          cp -r data/locale/* "pkg-root/Library/Application Support/obs-studio/plugins/vlc-video/data/locale/"

          cp installer/macos/preinstall pkg-scripts/preinstall
          cp installer/macos/postinstall pkg-scripts/postinstall
          chmod 755 pkg-scripts/preinstall pkg-scripts/postinstall

          cp installer/macos/welcome.html pkg-resources/welcome.html
          cp installer/macos/distribution.xml distribution.xml

          pkgbuild --root pkg-root \
                   --identifier com.kubolive.obs-vlc \
                   --version 1.0.0 \
                   --install-location "/" \
                   --scripts pkg-scripts \
                   component.pkg

          productbuild --distribution distribution.xml --resources pkg-resources --package-path . obs-vlc-by-kubo-macos-universal.pkg || cp component.pkg obs-vlc-by-kubo-macos-universal.pkg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obs-vlc-by-kubo-macos-universal
          path: |
            obs-vlc-by-kubo-macos-universal.tar.gz
            obs-vlc-by-kubo-macos-universal.pkg

  release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            obs-vlc-by-kubo-windows-x64/obs-vlc-by-kubo-windows-x64.zip
            obs-vlc-by-kubo-windows-x64/obs-vlc-by-kubo-windows-x64-installer.exe
            obs-vlc-by-kubo-linux-x86_64/obs-vlc-by-kubo-linux-x86_64.tar.gz
            obs-vlc-by-kubo-linux-x86_64/obs-vlc-by-kubo-linux-x86_64.deb
            obs-vlc-by-kubo-macos-universal/obs-vlc-by-kubo-macos-universal.tar.gz
            obs-vlc-by-kubo-macos-universal/obs-vlc-by-kubo-macos-universal.pkg
          draft: false
          prerelease: false
